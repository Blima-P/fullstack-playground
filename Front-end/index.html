<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Interativo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <h2>Meu Painel</h2>
    <nav>
      <a href="#">📊 Dashboard</a>
      <a href="#">📂 Projetos</a>
      <a href="#">⚙️ Configurações</a>
    </nav>
    <button id="toggleTheme">🌙 Mudar Tema</button>
  </aside>

  <main class="content">
    <header>
      <h1>Bem-vindo!</h1>
      <p>Veja abaixo os dados atualizados.</p>
    </header>

    <section class="cards">
      <div class="card">🚀 Projetos: <span id="projetos">12</span></div>
      <div class="card">👥 Usuários: <span id="usuarios">48</span></div>
      <div class="card">💰 Receita: R$ <span id="receita">2.300</span></div>
    </section>

    <section class="grafico">
      <canvas id="chart"></canvas>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
